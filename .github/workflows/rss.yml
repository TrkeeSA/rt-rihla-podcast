name: update-rss

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --frozen python src/main.py
      - name: Commit changes
        run: |
          git config user.name 'rss[bot]'
          git config user.email 'rss-bot@users.noreply.github.com'
          git add podcast.rss podcast.db
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update podcast.rss"
            git push
          fi
      - run: mkdir -p public && cp podcast.rss public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4